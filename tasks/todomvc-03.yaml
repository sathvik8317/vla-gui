instruction: "Add a new todo item labeled 'Write tests' by typing it into the input field and submitting it."
task_assertion: "Write tests"
optimal_steps: 1
notes: >
  Structural gap fixed: Action/PlannedStep now carry a submit flag, and
  act_node presses Enter after typing when the planner sets it (TodoMVC only
  adds the item on the Enter keydown, no submit button). Verified directly:
  act_node with submit=True commits the todo on the live target. Whether this
  task passes end-to-end now depends on the planner actually choosing
  submit=True for a single-field form with no visible button — a live run
  with the base planner did not set it and the task ran to
  step_budget_exceeded, consistent with the base model's already-documented
  single-step reliability limits rather than a new pipeline bug.
