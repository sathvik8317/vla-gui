[project]
name = "vlagui"
version = "0.1.0"
description = "Local vision-language agent for GUI automation"
readme = "README.md"
authors = [
    { email = "sathvik8317@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "fastapi>=0.141.1",
    "huggingface-hub<1.0",
    "langgraph>=1.2.10",
    "opencv-python-headless>=5.0.0.93",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers==4.49.0",
    "ultralytics>=8.4.116",
    "uvicorn>=0.52.1",
]

[project.scripts]
vlagui = "vlagui:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
